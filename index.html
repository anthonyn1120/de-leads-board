<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DE Leads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #ffffff; --surface-2: #f1f1ee; --border: #e4e4df; --border-strong: #cfcfc8;
  --text: #121211; --text-2: #55554f; --text-3: #8a8a82;
  --accent: #2a78d6; --accent-soft: #e3eefb; --accent-text: #1c5db0;
  --warm: #eb6834; --warm-soft: #fdebe3; --warm-text: #b8471c;
  --good: #1baf7a; --good-soft: #e1f5ec; --good-text: #117a55;
  --bar: #2a78d6; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --radius: 14px; --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1b1b1a; --surface-2: #232322; --border: #2c2c2a; --border-strong: #3b3b38;
    --text: #f3f3ef; --text-2: #b9b9b0; --text-3: #7f7f77;
    --accent: #3987e5; --accent-soft: #1d2f47; --accent-text: #8fbcf4;
    --warm: #d95926; --warm-soft: #3d2316; --warm-text: #f3a07a;
    --good: #199e70; --good-soft: #143326; --good-text: #6fd6ac;
    --bar: #3987e5; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1b1b1a; --surface-2: #232322; --border: #2c2c2a; --border-strong: #3b3b38;
  --text: #f3f3ef; --text-2: #b9b9b0; --text-3: #7f7f77;
  --accent: #3987e5; --accent-soft: #1d2f47; --accent-text: #8fbcf4;
  --warm: #d95926; --warm-soft: #3d2316; --warm-text: #f3a07a;
  --good: #199e70; --good-soft: #143326; --good-text: #6fd6ac;
  --bar: #3987e5; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, system-ui, -apple-system, sans-serif; font-feature-settings: "tnum" 1, "cv11" 1; }
a { color: inherit; text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 0 16px; }

header { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.bar { display: flex; align-items: center; gap: 14px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand .mark { width: 28px; height: 28px; border-radius: 8px; background: linear-gradient(135deg, var(--accent), #6ac1ff); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
.meta { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.search { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0 10px; height: 36px; min-width: 0; }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { flex: 1; border: 0; background: transparent; outline: 0; font: inherit; color: inherit; min-width: 0; }
.search kbd { font: 11px var(--mono); color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; }
.icon-btn:hover { border-color: var(--border-strong); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 20px 0; }
.kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); }
.kpi .label { color: var(--text-2); font-size: 12px; font-weight: 500; }
.kpi .value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 2px; line-height: 1.1; }
.kpi .sub { color: var(--text-3); font-size: 12px; margin-top: 4px; }
.kpi.hot .value { color: var(--accent-text); }

.row2 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 12px; margin-bottom: 20px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.card h3 { margin: 0 0 2px; font-size: 14px; font-weight: 600; }
.card .hint { color: var(--text-3); font-size: 12px; margin-bottom: 12px; }
.bars { display: grid; gap: 7px; }
.bar-row { display: grid; grid-template-columns: 110px 1fr 40px; align-items: center; gap: 10px; cursor: pointer; border-radius: 6px; }
.bar-row:hover .bar-label { color: var(--accent-text); }
.bar-row.on .bar-label { color: var(--accent-text); font-weight: 600; }
.bar-label { font-size: 12.5px; color: var(--text-2); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-track { height: 10px; background: var(--surface-2); border-radius: 0 4px 4px 0; overflow: hidden; }
.bar-fill { height: 100%; background: var(--bar); border-radius: 0 4px 4px 0; transition: width .3s ease; }
.bar-val { font-size: 12px; color: var(--text-3); font-variant-numeric: tabular-nums; }
.hotlist { display: grid; gap: 8px; }
.hot-item { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); cursor: pointer; }
.hot-item:hover { outline: 1px solid var(--border-strong); }
.hot-item .n { font-weight: 600; }
.hot-item .d { color: var(--text-3); font-size: 12px; margin-top: 1px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tab { padding: 10px 14px; border: 0; background: transparent; color: var(--text-2); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.tab .count { color: var(--text-3); font-weight: 400; margin-left: 6px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.fgroup { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; }
.fgroup .glabel { color: var(--text-3); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; padding: 0 6px 0 8px; }
.chip { border: 0; background: transparent; border-radius: 7px; padding: 5px 9px; font-size: 12.5px; color: var(--text-2); white-space: nowrap; }
.chip:hover { background: var(--surface-2); color: var(--text); }
.chip.on { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
.chip.warm.on { background: var(--warm-soft); color: var(--warm-text); }
.chip.good.on { background: var(--good-soft); color: var(--good-text); }
select.chip { appearance: none; -webkit-appearance: none; padding-right: 22px; background: var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%23888' stroke-width='1.5'/></svg>") no-repeat right 8px center; }
.stackpick { position: relative; }
.stackmenu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 20; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 8px; display: none; width: 300px; max-height: 320px; overflow: auto; }
.stackmenu.open { display: block; }
.stackmenu .chip { display: inline-block; margin: 2px; }
.spacer { flex: 1; }
.chip.more { border: 1px solid var(--border); background: var(--surface); }
.more-row { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; }
.reset { color: var(--text-3); font-size: 12px; background: transparent; border: 0; }
.reset:hover { color: var(--text); text-decoration: underline; }
.showing { color: var(--text-3); font-size: 12px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; }
.showing button { background: transparent; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px; font-size: 12px; color: var(--text-2); }

.tablewrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: auto; margin-bottom: 40px; }
table { width: 100%; border-collapse: collapse; min-width: 860px; }
th { text-align: left; font-size: 11.5px; font-weight: 600; color: var(--text-3); text-transform: uppercase; letter-spacing: .04em; padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--surface); }
th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
th:hover { color: var(--text); }
th .arrow { opacity: .5; margin-left: 4px; }
td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tbody tr.row:hover td { background: color-mix(in srgb, var(--surface-2) 60%, transparent); }
tr.row { cursor: pointer; }
.name { font-weight: 600; }
.sub { color: var(--text-3); font-size: 12px; margin-top: 2px; }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.hot { background: var(--accent); color: #fff; }
.pill.warm { background: var(--accent-soft); color: var(--accent-text); }
.pill.cold { background: var(--surface-2); color: var(--text-2); }
.pill.agency { background: var(--warm-soft); color: var(--warm-text); font-weight: 500; }
.tag { display: inline-block; padding: 1px 7px; border-radius: 6px; font-size: 11.5px; background: var(--surface-2); color: var(--text-2); margin: 1px 3px 1px 0; white-space: nowrap; }
.tag.cloud { background: var(--good-soft); color: var(--good-text); }
.badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .04em; padding: 1px 6px; border-radius: 5px; vertical-align: 2px; margin-left: 6px; }
.badge.new { background: var(--good-soft); color: var(--good-text); }
.badge.contract { background: var(--warm-soft); color: var(--warm-text); }
.badge.ent { background: var(--surface-2); color: var(--text-3); }
.badge.repost { background: var(--accent-soft); color: var(--accent-text); }
.type { font-size: 12px; color: var(--text-2); white-space: nowrap; }
.type.contract { color: var(--warm-text); font-weight: 600; }
.ext { color: var(--text-3); font-size: 11px; margin-left: 4px; }
.detail td { background: var(--surface-2); padding: 6px 12px 12px 12px; }
.jobs-mini { display: grid; gap: 6px; }
.jm { display: grid; grid-template-columns: 1fr auto auto auto; gap: 14px; align-items: baseline; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
.jm .t { font-weight: 500; }
.jm .s { color: var(--text-3); font-size: 12px; white-space: nowrap; }
.summary { color: var(--text-2); font-size: 12.5px; margin-top: 3px; }
.empty { text-align: center; color: var(--text-3); padding: 48px 16px; }
.empty code { font-family: var(--mono); background: var(--surface-2); padding: 2px 6px; border-radius: 5px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
#lock { position: fixed; inset: 0; z-index: 100; background: var(--bg); display: grid; place-items: center; padding: 16px; }
#lock[hidden] { display: none; }
.lockcard { width: 100%; max-width: 340px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); padding: 28px 24px; display: grid; gap: 10px; text-align: center; }
.locklabel { color: var(--text-2); font-size: 13px; }
.lockcard input { height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; font-size: 16px; padding: 0 12px; text-align: center; outline: 0; }
.lockcard input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lockcard button { height: 44px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; }
.lockerr { min-height: 18px; color: var(--text-3); font-size: 12.5px; }
footer { color: var(--text-3); font-size: 12px; padding: 0 0 40px; }

@media (max-width: 960px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .row2 { grid-template-columns: 1fr; }
  .meta { display: none; }
}
@media (max-width: 600px) {
  .kpis { grid-template-columns: repeat(2, 1fr); }
  .bar-row { grid-template-columns: 84px 1fr 34px; }
  .brand span.t { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand"><div class="mark">DE</div><span class="t">DE Leads</span></div>
    <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search companies, titles, stacks, locations…" autocomplete="off"><kbd>/</kbd></label>
    <div class="meta" id="meta"></div>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme">◐</button>
  </div>
</header>

<main class="wrap">
  <section class="kpis" id="kpis"></section>

  <section class="row2">
    <div class="card">
      <h3>Most requested stack</h3>
      <div class="hint">Across active postings. Click a bar to filter.</div>
      <div class="bars" id="bars"></div>
    </div>
    <div class="card">
      <h3>Hot leads</h3>
      <div class="hint" id="hothint"></div>
      <div class="hotlist" id="hotlist"></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab on" data-tab="companies" role="tab">Companies<span class="count" id="c-count"></span></button>
    <button class="tab" data-tab="jobs" role="tab">Jobs<span class="count" id="j-count"></span></button>
  </nav>

  <section class="filters" id="filters"></section>
  <div class="showing"><span id="showing"></span><button id="csv">Export CSV</button></div>
  <div class="tablewrap"><table id="table"><thead></thead><tbody></tbody></table></div>
</main>
<footer class="wrap" id="foot"></footer>

<div id="lock" hidden>
  <form id="lockform" class="lockcard" autocomplete="off">
    <div class="brand" style="justify-content:center;margin-bottom:14px"><div class="mark">DE</div><span>DE Leads</span></div>
    <label for="pc" class="locklabel">Enter the team passcode</label>
    <input id="pc" type="password" autofocus>
    <button type="submit">Open</button>
    <div id="lockerr" class="lockerr"></div>
  </form>
</div>

const today = new Date(); today.setHours(0,0,0,0);
function daysAgo(ymd) { if (!ymd) return null; const d = new Date(ymd + "T00:00:00"); return Math.round((today - d) / 864e5); }

  if (n <= 0) return "Today"; if (n === 1) return "Yesterday"; if (n < 30) return n + "d ago";
  return new Date(ymd + "T00:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function fmtMoney(n) { return n >= 1000 ? "$" + Math.round(n / 1000) + "k" : "$" + n; }

function jobPasses(j) {
  if (F.days && (daysAgo(j.posted) ?? 999) > F.days) return false;
  if (F.sites.size && !F.sites.has(j.site)) return false;
  if (F.types.size && !F.types.has(j.type)) return false;
  if (F.levels.size && !F.levels.has(j.level)) return false;
  if (F.flavors.size && !F.flavors.has(j.flavor)) return false;
  if (F.clouds.size && !j.cloud.some(c => F.clouds.has(c))) return false;
  if (F.stacks.size && ![...F.stacks].every(s => j.stack.includes(s))) return false;

  if (F.contract && !j.contract && j.type !== "contract") return false;

}

// ------------------------------------------------------------ render: top
function renderTop() {
  const k = DATA.kpis;
  $("#kpis").innerHTML = [
    ["Companies hiring", k.companies, k.agencies + " agencies hidden", ""],
    ["Hot leads", k.hot, "score " + DATA.hot_threshold + " or more", "hot"],
    ["Contract roles", k.contract_roles, "listed or signalled", ""],
    ["Active postings", k.active_jobs, k.new_24h ? k.new_24h + " new since yesterday" : DATA.filters.sites.map(s => SITE_LABEL[s] || s).join(" + "), ""],
  ].map(([l, v, s, c]) => `<div class="kpi ${c}"><div class="label">${l}</div><div class="value">${v.toLocaleString()}</div><div class="sub">${esc(s)}</div></div>`).join("");

  const max = Math.max(1, ...DATA.stack_counts.map(x => x[1]));
  $("#bars").innerHTML = DATA.stack_counts.map(([t, n]) =>
    `<div class="bar-row ${F.stacks.has(t) ? "on" : ""}" data-stack="${esc(t)}" title="${esc(t)}: ${n} postings">
       <div class="bar-label">${esc(t)}</div><div class="bar-track"><div class="bar-fill" style="width:${(n / max * 100).toFixed(1)}%"></div></div><div class="bar-val">${n}</div></div>`).join("")
    || `<div class="empty">No tags yet. Run <code>make tag</code>.</div>`;
  $("#bars").querySelectorAll(".bar-row").forEach(el => el.onclick = () => { toggle(F.stacks, el.dataset.stack); });

  const hot = DATA.companies.filter(c => !c.agency && c.score >= DATA.hot_threshold).slice(0, 6);
  $("#hothint").textContent = hot.length ? "Highest-scoring non-agency companies right now. Click to open." : "Nothing over the threshold yet.";
  $("#hotlist").innerHTML = hot.map(c => {
    const st = c.stack.slice(0, 3).map(x => x[0]).join(" · ");
    return `<div class="hot-item" data-ck="${esc(c.key)}"><div><div class="n">${esc(c.name)}${c.new ? '<span class="badge new">NEW</span>' : ""}</div>
      <div class="d">${c.open} open · ${c.contract} contract · ${c.aging} aging${st ? " · " + esc(st) : ""}</div></div><span class="pill hot">${c.score}</span></div>`;
  }).join("") || `<div class="empty">—</div>`;
  $("#hotlist").querySelectorAll(".hot-item").forEach(el => el.onclick = () => { F.tab = "companies"; F.q = ""; $("#q").value = ""; open.add(el.dataset.ck); render(); document.getElementById("row-" + CSS.escape(el.dataset.ck))?.scrollIntoView({ behavior: "smooth", block: "center" }); });

  const lr = DATA.last_run;
  $("#meta").textContent = "built " + fmtTs(DATA.generated_at);
  const who = (DATA.contributors || []).map(c => `${c.who} ${c.n}`).join(", ");
  $("#foot").textContent = (lr ? `Last collection: ${fmtTs(lr.started_at)} (${lr.mode}) · ${lr.queries} queries · ${lr.fetched} rows · ${lr.inserted} new · ${lr.errors} errors. Scoring: 3×contract + 2×aging(${DATA.aging_days}d) + 2×reposted + 1×open (capped at 8) + 1×bench overlap + 0.5×senior; enterprise −10, agencies −100.` : "") + (DATA.dupes_hidden ? ` ${DATA.dupes_hidden} cross-board duplicates merged.` : "") + (who ? ` Found by: ${who}.` : "");
}

// ------------------------------------------------------------ render: filters
function chip(set, v, label, cls = "") { return `<button class="chip ${cls} ${set.has(v) ? "on" : ""}" data-set="${set === F.sites ? "sites" : set === F.types ? "types" : set === F.levels ? "levels" : set === F.flavors ? "flavors" : set === F.clouds ? "clouds" : "stacks"}" data-v="${esc(v)}">${esc(label)}</button>`; }
function toggle(set, v) { set.has(v) ? set.delete(v) : set.add(v); render(); }
function renderFilters() {
  const f = DATA.filters;
  const stackSel = [...F.stacks];
  $("#filters").innerHTML = `
    <div class="fgroup"><span class="glabel">Posted</span>
      <select class="chip" id="days">${[[0, "Any time"], [1, "24 hours"], [3, "3 days"], [7, "7 days"], [14, "14 days"], [30, "30 days"]].map(([d, l]) => `<option value="${d}" ${F.days == d ? "selected" : ""}>${l}</option>`).join("")}</select></div>
    <div class="fgroup"><span class="glabel">Type</span>${f.types.map(t => chip(F.types, t, TYPE_LABEL[t] || t, t === "contract" || t === "temporary" ? "warm" : "")).join("")}</div>
    <div class="fgroup"><span class="glabel">Level</span>${f.levels.map(l => chip(F.levels, l, cap(l))).join("")}</div>
    <div class="fgroup"><span class="glabel">Cloud</span>${f.clouds.map(c => chip(F.clouds, c, c.toUpperCase(), "good")).join("")}</div>
    <div class="fgroup stackpick"><span class="glabel">Stack</span><button class="chip ${stackSel.length ? "on" : ""}" id="stackbtn">${stackSel.length ? esc(stackSel.join(" + ")) : "Any"} ▾</button>
      <div class="stackmenu" id="stackmenu">${f.stacks.map(s => chip(F.stacks, s, s)).join("")}</div></div>
    <div class="fgroup">
      <button class="chip warm ${F.contract ? "on" : ""}" data-flag="contract">Contract</button>
      <button class="chip ${F.remote ? "on" : ""}" data-flag="remote">Remote</button>
    </div>
    <button class="chip more ${F.more || F.flavors.size || F.sites.size || F.newOnly || !F.hideAgency ? "on" : ""}" id="more">More ${F.more ? "▴" : "▾"}</button>
    <span class="spacer"></span><button class="reset" id="reset">Reset</button>
    <div class="more-row" style="display:${F.more ? "flex" : "none"}">
      <div class="fgroup"><span class="glabel">Flavor</span>${f.flavors.map(x => chip(F.flavors, x, cap(x))).join("")}</div>
      ${f.sites.length > 1 ? `<div class="fgroup"><span class="glabel">Source</span>${f.sites.map(s => chip(F.sites, s, SITE_LABEL[s] || s)).join("")}</div>` : ""}
      <div class="fgroup">
        <button class="chip good ${F.newOnly ? "on" : ""}" data-flag="newOnly">New only</button>
        <button class="chip ${F.hideAgency ? "on" : ""}" data-flag="hideAgency">Hide agencies</button>
      </div>
    </div>`;
  $("#more").onclick = () => { F.more = !F.more; render(); };
  $("#filters").querySelectorAll("[data-set]").forEach(el => el.onclick = () => toggle(F[el.dataset.set], el.dataset.v));
  $("#filters").querySelectorAll("[data-flag]").forEach(el => el.onclick = () => { F[el.dataset.flag] = !F[el.dataset.flag]; render(); });
  $("#days").onchange = e => { F.days = +e.target.value; render(); };
  $("#stackbtn").onclick = e => { e.stopPropagation(); $("#stackmenu").classList.toggle("open"); };
  $("#stackmenu").onclick = e => e.stopPropagation();
  $("#reset").onclick = () => { for (const k of ["sites","types","levels","flavors","stacks","clouds"]) F[k].clear(); Object.assign(F, { q: "", days: 0, remote: false, contract: false, newOnly: false, hideAgency: true, minScore: 0 }); $("#q").value = ""; render(); };
}
document.addEventListener("click", () => $("#stackmenu")?.classList.remove("open"));

// ------------------------------------------------------------ render: tables
const COLS = {
  companies: [
    ["name", "Company", ""], ["score", "Score", "num"], ["open", "Open", "num"], ["contract", "Contract", "num"], ["aging", "Aging", "num"],
    ["stack", "Stack", ""], ["latest", "Latest post", ""],
  ],
  jobs: [
    ["title", "Role", ""], ["company", "Company", ""], ["location", "Location", ""], ["type", "Type", ""],
    ["posted", "Posted", ""], ["stack", "Stack", ""], ["salary", "Salary", "num"],
  ],
};
function sortRows(rows, [k, dir]) {
  const val = r => { const v = r[k]; if (Array.isArray(v)) return v.length ? (typeof v[0] === "number" ? v[0] : (Array.isArray(v[0]) ? v.length : v.length)) : -1; if (v == null) return k === "posted" || k === "latest" ? "" : -1; return typeof v === "string" ? v.toLowerCase() : v; };
  return rows.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : x > y ? 1 : 0) * dir; });
}
function tagList(arr, max, cls = "") { const t = arr.slice(0, max).map(x => `<span class="tag ${cls}">${esc(Array.isArray(x) ? x[0] : x)}</span>`).join(""); const rest = arr.length - max; return t + (rest > 0 ? `<span class="tag">+${rest}</span>` : ""); }
function scorePill(c) { return c.agency ? `<span class="pill agency" title="${esc(c.agency_reason || "")}">agency</span>` : `<span class="pill ${c.score >= DATA.hot_threshold ? "hot" : c.score >= DATA.hot_threshold / 2 ? "warm" : "cold"}">${c.score}</span>`; }
function jobLine(j) {
  return `<div class="jm"><div><a class="t" href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a><span class="ext">${SITE_LABEL[j.site] || j.site} ↗</span>${(j.also || []).map(a => `<a class="ext" href="${esc(a.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">also ${SITE_LABEL[a.site] || a.site} ↗</a>`).join("")}
      ${j.new ? '<span class="badge new">NEW</span>' : ""}${j.contract || j.type === "contract" ? '<span class="badge contract">CONTRACT</span>' : ""}${j.repost ? '<span class="badge repost">REPOSTED</span>' : ""}
      ${j.summary ? `<div class="summary">${esc(j.summary)}</div>` : ""}<div style="margin-top:4px">${tagList(j.stack, 8)}${tagList(j.cloud, 3, "cloud")}</div></div>
    <span class="s">${esc(j.location || "—")}${j.remote ? " · remote" : ""}</span><span class="s">${cap(j.level)}${j.years ? " · " + j.years + "y+" : ""}</span><span class="s">${fmtDate(j.posted)}${j.salary ? " · " + fmtSalary(j.salary) : ""}</span></div>`;
}
function renderTable() {
  const vj = visibleJobs();
  const vc = visibleCompanies(vj);
  $("#c-count").textContent = vc.length; $("#j-count").textContent = vj.length;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === F.tab));
  const cols = COLS[F.tab], [sk, sd] = sort[F.tab];
  $("#table thead").innerHTML = "<tr>" + cols.map(([k, l, c]) => `<th class="${c}" data-k="${k}">${l}${sk === k ? `<span class="arrow">${sd > 0 ? "↑" : "↓"}</span>` : ""}</th>`).join("") + "</tr>";
  $("#table thead").querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; sort[F.tab] = sk === k ? [k, -sd] : [k, k === "name" || k === "title" || k === "company" || k === "location" ? 1 : -1]; render(); });

  const tb = $("#table tbody");
  if (!DATA.jobs.length) { tb.innerHTML = `<tr><td colspan="${cols.length}"><div class="empty">No data yet. Run <code>make run</code> and reopen this file.</div></td></tr>`; $("#showing").textContent = ""; return; }

  if (F.tab === "companies") {
    const rows = sortRows(vc, sort.companies);
    $("#showing").textContent = `${rows.length} companies · ${vj.length} matching postings`;
    tb.innerHTML = rows.map(c => `
      <tr class="row" id="row-${esc(c.key)}" data-ck="${esc(c.key)}">
        <td><div class="name">${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${esc(c.name)}</a>` : esc(c.name)}${c.new ? '<span class="badge new">NEW</span>' : ""}${c.enterprise ? '<span class="badge ent" title="Enterprise: procurement + vendor lists, scored −10">ENT</span>' : ""}</div>
            <div class="sub">${esc((c.industry || "").split(",")[0])}${c.industry && c.cities ? " · " : ""}${c.cities ? c.cities + (c.cities === 1 ? " location" : " locations") : ""}${c.remote ? " · " + c.remote + " remote" : ""}${c.open > 1 && c.senior ? " · " + c.senior + " senior+" : ""}</div></td>
        <td class="num">${scorePill(c)}</td><td class="num">${c.vjobs.length}${c.vjobs.length !== c.open ? `<span class="sub">of ${c.open}</span>` : ""}</td>
        <td class="num">${c.contract || ""}</td><td class="num">${c.aging || ""}${c.reposted ? `<div class="sub">${c.reposted} reposted</div>` : ""}</td>
        <td>${tagList(c.stack, 3)}${tagList(c.clouds, 2, "cloud")}</td><td>${fmtDate(c.latest)}</td></tr>
      ${open.has(c.key) ? `<tr class="detail"><td colspan="${cols.length}"><div class="jobs-mini">${c.vjobs.map(jobLine).join("")}</div></td></tr>` : ""}`).join("");
    tb.querySelectorAll("tr.row").forEach(tr => tr.onclick = () => { const k = tr.dataset.ck; open.has(k) ? open.delete(k) : open.add(k); renderTable(); });
  } else {
    const rows = sortRows(vj.slice(), sort.jobs);
    $("#showing").textContent = `${rows.length} postings`;
    tb.innerHTML = rows.map(j => `
      <tr><td><div class="name"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.title)}</a><span class="ext">${SITE_LABEL[j.site] || j.site} ↗</span>${(j.also || []).map(a => `<a class="ext" href="${esc(a.url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">also ${SITE_LABEL[a.site] || a.site} ↗</a>`).join("")}${j.new ? '<span class="badge new">NEW</span>' : ""}${j.repost ? '<span class="badge repost">REPOSTED</span>' : ""}</div>
            <div class="sub">${cap(j.level)}${j.years ? " · " + j.years + "+ yrs" : ""}${j.flavor && j.flavor !== "pipelines" ? " · " + cap(j.flavor) : ""}</div>
            ${j.summary ? `<div class="summary">${esc(j.summary)}</div>` : ""}</td>
        <td>${esc(j.company)}</td><td>${esc(j.location || "—")}${j.remote ? '<div class="sub">remote</div>' : ""}</td>
        <td><span class="type ${j.contract || j.type === "contract" ? "contract" : ""}" title="${esc(j.contract_reason || "")}">${j.contract && j.type !== "contract" ? "Contract?" : TYPE_LABEL[j.type] || j.type}</span></td>
        <td>${fmtDate(j.posted)}</td>
        <td>${tagList(j.stack, 3)}${tagList(j.cloud, 2, "cloud")}</td><td class="num">${fmtSalary(j.salary)}</td></tr>`).join("");
  }
}

function render() { renderFilters(); renderTable(); $("#bars").querySelectorAll(".bar-row").forEach(el => el.classList.toggle("on", F.stacks.has(el.dataset.stack))); }

// ------------------------------------------------------------ wiring
document.querySelectorAll(".tab").forEach(t => t.onclick = () => { F.tab = t.dataset.tab; render(); });
let qt; $("#q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { F.q = e.target.value.trim().toLowerCase(); render(); }, 120); };
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== $("#q")) { e.preventDefault(); $("#q").focus(); } if (e.key === "Escape") { $("#q").blur(); $("#stackmenu")?.classList.remove("open"); } });
$("#csv").onclick = () => {
  const vj = visibleJobs();
  let rows;
  if (F.tab === "companies") rows = [["company", "score", "open", "contract", "aging", "reposted", "remote", "stack", "clouds", "latest_post", "linkedin"], ...visibleCompanies(vj).map(c => [c.name, c.score, c.open, c.contract, c.aging, c.reposted, c.remote, c.stack.map(x => x[0]).join("|"), c.clouds.join("|"), c.latest, c.url])];
  else rows = [["title", "company", "location", "remote", "type", "contract_signal", "level", "years_min", "posted", "stack", "cloud", "languages", "salary_min", "salary_max", "source", "url"], ...vj.map(j => [j.title, j.company, j.location, j.remote, j.type, j.contract, j.level, j.years, j.posted, j.stack.join("|"), j.cloud.join("|"), j.lang.join("|"), j.salary?.[0], j.salary?.[1], j.site, j.url])];
  const csv = rows.map(r => r.map(v => `"${String(v ?? "").replace(/"/g, '""')}"`).join(",")).join("\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `de-leads-${F.tab}.csv`; a.click();
};

if (DATA) { renderTop(); render(); }
else if (!ENC) document.body.innerHTML = '<div class="empty">Template only. Run <code>python -m de_leads dashboard</code> to build.</div>';
</script>
</body>
</html>
